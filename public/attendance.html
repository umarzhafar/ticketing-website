<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Hadir Penonton - HELLPHORIA</title>
    <link rel="stylesheet" href="style.css">
    <!-- Tambahkan library SheetJS untuk export Excel di dalam <head> -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #eee; padding-bottom: 15px; }
        .header-flex h1 { color: #4f0814; font-size: 22px; }
        
        .btn-back { background: #6c757d; color: white; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: bold; text-decoration: none; }
        .btn-back:hover { background: #5a6268; }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; color: #444; }
        th { background-color: #f8f9fa; color: #4f0814; font-weight: bold; }
        tr:hover { background-color: #fdfdfd; }
    </style>
</head>
<body style="background-color: #f4f6f8;">

    <div class="top-bar">
        <a href="index.html">Kembali ke Beranda</a>
    </div>

    <main class="container">
        <div class="card">
            <div class="header-flex">
                <h1>Daftar Penonton Check-In</h1>
                <div>
                    <button id="btnExport" style="background: #28a745; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-right: 10px;">📥 Download Excel</button>
                    <a href="scanner.html" class="btn-back">&larr; Kembali ke Scanner</a>
                </div>
            </div>

            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Nama Penonton</th>
                            <th>Paket Tiket</th>
                            <th>Kode Reservasi</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="attendanceTableBody">
                        <tr>
                            <td colspan="4" style="text-align: center; color: #777;">Memuat data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script type="module" src="attendance.js"></script>
</body>
</html>
